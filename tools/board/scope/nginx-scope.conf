# nginx site for the microscope viewer from outside (docs 11.110): the Cloudflare quick tunnel
# (e850-scope-tunnel.service) reaches the viewer only through here, behind a password; the LAN keeps :8090 as before.
# The password file is made on the board and never goes into git:
#   printf '%s\n' "$PASSWORD" | openssl passwd -apr1 -stdin | sed 's/^/scope:/' > /etc/nginx/e850-scope.htpasswd
#   chown root:www-data /etc/nginx/e850-scope.htpasswd && chmod 640 /etc/nginx/e850-scope.htpasswd
server {
	listen 127.0.0.1:8091;
	auth_basic "SOL Microscope";
	auth_basic_user_file /etc/nginx/e850-scope.htpasswd;
	location / {
		proxy_pass http://127.0.0.1:8090;
		proxy_buffering off;		# a frame goes out as it comes (/frame.png long-polls)
		proxy_http_version 1.1;
		proxy_set_header Connection "";
	}
}
