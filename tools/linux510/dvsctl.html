<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVS 화면 조정</title>
<style>
  :root { --bg: #111; --panel: #1b1b1b; --fg: #e8e8e8; --dim: #9a9a9a; --accent: #4fc36a; --line: #2c2c2c; --alarm: #ff5a4f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  #view { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #000; border-radius: 4px; display: block; margin-inline: auto; }
  h2 { font-size: 15px; margin: 18px 0 2px; color: var(--dim); font-weight: 600; }
  #s-apply { margin-top: 6px; }
  #stats { color: var(--dim); font: 13px/1.5 ui-monospace, Menlo, monospace; margin-top: 8px; min-height: 3em; }
  .row { display: grid; grid-template-columns: 7.5em 1fr 3.5em; gap: 8px; align-items: center; margin: 10px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row select { grid-column: 2 / 4; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button { background: #262626; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px 10px; font: inherit; }
  button:hover, select:hover { border-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .hint { color: var(--dim); font-size: 13px; margin: 2px 0 0 8.1em; }
  #msg { color: var(--dim); font-size: 13px; min-height: 1.4em; }
  #act { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 4px 0 10px; }
  #a-state { font-size: 28px; font-weight: 700; }
  #a-top { color: var(--dim); font-size: 13px; }
  #a-recent { color: var(--dim); font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 4px 0 0; padding-left: 1.6em; }
  .fall { color: var(--alarm) !important; }
  .toggle { display: flex; gap: 8px; align-items: center; color: var(--dim); margin-top: 8px; font-size: 13px; }
  .toggle { flex-wrap: wrap; }
  #view { cursor: crosshair; touch-action: none; }
  #crop-info { color: var(--dim); font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #addr { color: var(--dim); font-size: 13px; margin-top: 4px; }
  #addr a { color: var(--fg); margin-right: 12px; }
  .wide { grid-column: 1 / -1; }
  input[type=text], input[type=number] { background: #262626; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 6px 8px; font: 14px ui-monospace, Menlo, monospace; width: 100%; }
  #g-out { border-collapse: collapse; margin-top: 8px; font: 13px/1.5 ui-monospace, Menlo, monospace; width: 100%; }
  #g-out th { color: var(--dim); font-weight: 400; text-align: left; border-bottom: 1px solid var(--line); padding: 2px 6px; }
  #g-out td { padding: 1px 6px; font-variant-numeric: tabular-nums; }
  #g-out td.name { color: var(--dim); }
  #g-dec { color: var(--fg); font: 13px/1.5 ui-monospace, Menlo, monospace; margin-top: 6px; white-space: pre-line; }
  .g-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
  .g-head h1 { margin: 0; }
  .g-head label { color: var(--dim); font-size: 13px; }
  #charts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .chart { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 6px; }
  .chart .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .chart .name { color: var(--dim); }
  .chart .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .chart .rng { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chart canvas { width: 100%; height: 64px; display: block; margin-top: 4px; }
  .alarm { color: var(--alarm); }
  #tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); margin-bottom: 4px; }
  .tile { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .tile .name { color: var(--dim); font-size: 12px; }
  .tile .val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .rng { color: var(--dim); font-size: 12px; }
  #charts .grp { grid-column: 1 / -1; margin: 10px 0 -4px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>DVS 화면 조정</h1>
    <div id="act" aria-live="polite"><span id="a-state">분류기 기다리는 중…</span><span id="a-top"></span></div>
    <canvas id="view" width="960" height="720" aria-label="지금 HDMI에 나가는 화면"></canvas>
    <div class="toggle"><label for="webfps">미리보기</label>
      <select id="webfps"><option value="0">끔</option><option value="2">2 fps</option><option value="5">5 fps</option>
        <option value="10" selected>10 fps</option><option value="15">15 fps</option><option value="20">20 fps</option>
        <option value="30">30 fps</option></select>
      <span id="webrate"></span></div>
    <div class="toggle"><span>자르기: 화면을 끌어서 영역 선택</span>
      <button id="crop-reset">전체 보기</button><button id="snap">이미지 저장</button></div>
    <div class="toggle"><span>회전: 이 웹 화면만 (HDMI는 그대로)</span>
      <button id="rot-l">↺ 왼쪽 90°</button><button id="rot-r">↻ 오른쪽 90°</button></div>
    <div id="crop-info" aria-live="polite"></div>
    <div id="addr"></div>
    <div id="stats">통계 기다리는 중…</div>
    <h2>최근 판정 변화</h2>
    <ol id="a-recent"></ol>
  </section>
  <section class="panel">
    <div class="presets">
      <button data-preset="default">기본값</button>
      <button data-preset="clean">잡음 제거</button>
      <button data-preset="trails">잔상</button>
      <button data-preset="full">전체 화면</button>
    </div>
    <div id="controls"></div>
    <div id="msg"></div>
    <h2>센서 (적용하면 스트림을 다시 시작, 약 5초)</h2>
    <div class="row"><label for="s-rate">scan 속도</label><select id="s-rate"></select></div>
    <div class="hint" id="s-rate-hint"></div>
    <div class="row"><label for="s-flush_us">MIPI flush</label><input type="range" id="s-flush_us" min="1" max="1023" step="1">
      <output id="o-flush_us"></output></div>
    <div class="hint">센서 FIFO를 이 시간(µs)마다 내보냄: 짧을수록 버퍼가 잦고 지연이 적음, 기본 50</div>
    <button id="s-apply">센서 설정 적용</button>
    <div id="s-msg" class="hint"></div>
    <h2>행동 녹화 (학습용, 3초 뒤 시작)</h2>
    <div class="row"><label for="r-label">동작</label><select id="r-label"></select></div>
    <div class="row"><label for="r-s">길이</label><select id="r-s"><option value="4">4초</option>
      <option value="6" selected>6초</option><option value="10">10초</option><option value="20">20초</option></select></div>
    <button id="r-go">녹화</button>
    <div id="r-msg" class="hint" aria-live="polite"></div>
    <h2>센서 레지스터 읽기 (읽기만, 스트림은 그대로)</h2>
    <div class="presets" id="g-presets"></div>
    <div class="row"><label for="g-a">주소 (16진)</label><input type="text" id="g-a" value="30A5" maxlength="4" spellcheck="false">
      <input type="number" id="g-n" value="3" min="1" max="64" aria-label="개수"></div>
    <button id="g-go">읽기</button> <span id="g-msg" class="hint" aria-live="polite"></span>
    <table id="g-out" hidden><thead><tr><th>주소</th><th>이름</th><th>16진</th><th>10진</th><th>2진</th></tr></thead><tbody></tbody></table>
    <div id="g-dec"></div>
  </section>
  <section class="panel wide">
    <div class="g-head"><h1>통계 그래프</h1>
      <label for="h-win">기간</label><select id="h-win"><option value="120">2분</option><option value="600" selected>10분</option>
        <option value="1800">30분</option><option value="3600">1시간</option></select>
      <button id="h-csv">CSV 저장</button>
      <span id="h-msg" class="hint" aria-live="polite"></span></div>
    <div id="tiles"></div>
    <div id="charts"></div>
  </section>
</main>
<script>
const LABELS = {
  fps: ['화면 갱신', 'fps', '초당 그리는 횟수'],
  window_ms: ['누적 시간', 'ms', '한 장에 모아 그리는 센서 시간, 0 = 한 프레임'],
  fade: ['잔상', '', '0 = 매번 지움, 클수록 이전 장면이 오래 남음'],
  filter_ms: ['잡음 필터', 'ms', '이웃 픽셀이 이 시간 안에 반응한 이벤트만, 0 = 끔'],
  color: ['색', '', ''],
  zoom: ['크기', '', ''],
  flip: ['뒤집기', '', ''],
  margin_ms: ['재생 여유', 'ms', '작을수록 지연이 줄고 늦은 이벤트를 놓침'],
};
const CHOICES = {
  color: ['ON 초록 / OFF 빨강', 'ON 흰색 / OFF 파랑', '모두 흰색', 'ON만', 'OFF만'],
  zoom: ['960×720 (1배)', '1440×1080 (1.5배, 세로 꽉)'],
  flip: ['그대로', '좌우 반전', '상하 반전', '180° 회전'],
};
const PRESETS = {
  clean: { filter_ms: 4, fade: 0 },
  trails: { fade: 200, window_ms: 0 },
  full: { zoom: 1 },
};
let params = {}, pending = {}, timer = null;

function show(msg) { document.getElementById('msg').textContent = msg; }

function post(changes) {
  Object.assign(pending, changes);
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const body = JSON.stringify(pending);
    pending = {};
    try {
      const r = await fetch('/params', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const j = await r.json();
      if (j.params) { for (const k in j.params) params[k].v = j.params[k]; sync(); }
      show(j.rejected && j.rejected.length ? '적용 안 됨: ' + j.rejected.join(', ') : '적용됨, 다음 실행에도 유지');
    } catch (e) { show('보드에 연결할 수 없음: ' + e.message); }
  }, 120);
}

function sync() {
  for (const [k, p] of Object.entries(params)) {
    const el = document.getElementById('p-' + k);
    if (!el) continue;
    el.value = p.v;
    const out = document.getElementById('o-' + k);
    if (out) out.textContent = p.v + (LABELS[k] ? LABELS[k][1] : '');
  }
}

function build() {
  const box = document.getElementById('controls');
  box.textContent = '';
  for (const [k, p] of Object.entries(params)) {
    const [name, unit, hint] = LABELS[k] || [k, '', ''];
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('label');
    lab.htmlFor = 'p-' + k;
    lab.textContent = name;
    row.append(lab);
    let input;
    if (CHOICES[k]) {
      input = document.createElement('select');
      CHOICES[k].forEach((text, i) => { if (i >= p.min && i <= p.max) input.add(new Option(text, i)); });
      input.onchange = () => post({ [k]: +input.value });
      row.append(input);
    } else {
      input = document.createElement('input');
      input.type = 'range';
      input.min = p.min; input.max = p.max; input.step = 1;
      const out = document.createElement('output');
      out.id = 'o-' + k;
      input.oninput = () => { out.textContent = input.value + unit; post({ [k]: +input.value }); };
      row.append(input, out);
    }
    input.id = 'p-' + k;
    box.append(row);
    if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hint; box.append(h); }
  }
  sync();
}

document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const name = b.dataset.preset;
  const changes = name === 'default'
    ? Object.fromEntries(Object.entries(params).map(([k, p]) => [k, p.def]))
    : PRESETS[name];
  for (const k in changes) if (params[k]) params[k].v = changes[k];
  sync();
  post(changes);
});

let lastCrc = null;
async function refreshStats() {
  try {
    const s = await (await fetch('/stats')).json(), t = performance.now();
    let crc = '';
    if (s.crc !== undefined) {
      if (lastCrc && s.crc >= lastCrc.n) crc = `, CRC 오류 ${Math.round((s.crc - lastCrc.n) * 1000 / (t - lastCrc.t))}/s`;
      lastCrc = { n: s.crc, t };
    }
    if (s.addrs) {        // the board's web addresses, also at the bottom left of HDMI (11.50)
      const box = document.getElementById('addr');
      box.replaceChildren('웹 접속 주소: ', ...s.addrs.flatMap(([name, url]) => {
        const v = url ? Object.assign(document.createElement('a'), { href: 'http://' + url + '/', textContent: url })
                      : document.createTextNode('연결 안 됨 ');
        return [name + ' ', v];
      }));
    }
    if (s.fps === undefined) return;
    document.getElementById('stats').textContent =
      `${s.fps} fps, 그리기 ${s.draw_ms} ms, 프레임당 이벤트 ${s.events}\n` +
      `버퍼 ${s.buffers}/s, 복사 ${s.ingest_ms} ms, ${s.kb} kB/버퍼\n` +
      `최신 이벤트보다 ${s.behind_ms} ms 늦음, 시간의 ${s.coverage}%에 데이터, 어두운 프레임 ${s.dips}장/2초\n` +
      `센서 scan ${s.scan_us} µs (${Math.round(1e6 / s.scan_us)} fps)${crc}` +
      (s.pll ? `\nPLL ${s.pll.slice(0, 8)}` + ((m => m ? ` (공식으로 ${m[1]} Mbps, 잰 값 아님)` : '')(/rate=(\d+)/.exec(s.pll))) : '') +
      (s.link ? `\n스트림 시작부터: 짧은 버퍼 ${s.link.short_bufs}, scan 누락 ${s.link.ts_missed}, ` +
                `frame_end 누락 ${s.link.fe_missed}, 타임스탬프 오류 ${s.link.ts_bad}` : '');
    document.getElementById('stats').style.whiteSpace = 'pre-line';
  } catch (e) { /* the next poll will tell */ }
}

// one request at a time, as often as the chosen rate allows; drawn on a canvas so nothing is fetched twice
let W = 960, H = 720, FULL = { x: 0, y: 0, w: W, h: H };     // the view, after rotation
const view = document.getElementById('view'), ctx = view.getContext('2d');
let shown = 0, rateT = performance.now();
// crop (11.50): drag on the view picks a region of the frame (frame px, after flip and rotation), drawn enlarged
// here only; HDMI and /frame.png stay whole. raw: the last bitmap, frame: raw turned by rot, crop: null = whole,
// drag: the rectangle being drawn
let raw = null, frame = null, crop = null, drag = null;
const off = Object.assign(document.createElement('canvas'), { width: W, height: H });
const offx = off.getContext('2d', { willReadFrequently: true });
// rotation (11.54): quarter turns clockwise of this web view only, for a camera mounted another way round.
// Kept per browser and board address; ?rot=90|180|270 in the address overrides it
let rot = 0;
const rc = document.createElement('canvas'), rcx = rc.getContext('2d');
function orient() {
  if (!rot || !raw) return raw;
  rc.width = W; rc.height = H;            // also resets the transform
  rcx.translate(W / 2, H / 2);
  rcx.rotate(rot * Math.PI / 2);
  rcx.drawImage(raw, -raw.width / 2, -raw.height / 2);
  return rc;
}
function setRot(r) {
  rot = ((r % 4) + 4) % 4;
  [W, H] = rot % 2 ? [720, 960] : [960, 720];
  FULL = { x: 0, y: 0, w: W, h: H };
  view.width = off.width = W; view.height = off.height = H;
  view.style.aspectRatio = `${W} / ${H}`;
  view.style.width = rot % 2 ? '75%' : '';  // upright: about as tall as the landscape view
  crop = null;
  try { localStorage.setItem('dvs-rot', rot); } catch (e) { /* private window: not kept */ }
  frame = orient(); draw(); countPixels();
}
document.getElementById('rot-l').onclick = () => setRot(rot - 1);
document.getElementById('rot-r').onclick = () => setRot(rot + 1);
function fit(c) { const k = Math.min(W / c.w, H / c.h); return { k, ox: (W - c.w * k) / 2, oy: (H - c.h * k) / 2 }; }
function norm(d) {
  const x = Math.round(Math.min(d.x0, d.x1)), y = Math.round(Math.min(d.y0, d.y1));
  return { x, y, w: Math.round(Math.max(d.x0, d.x1)) - x, h: Math.round(Math.max(d.y0, d.y1)) - y };
}
function draw() {
  const c = crop || FULL, f = fit(c);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;      // enlarged pixels stay sharp
  if (frame) ctx.drawImage(frame, c.x, c.y, c.w, c.h, f.ox, f.oy, c.w * f.k, c.h * f.k);
  if (drag) {
    const r = norm(drag);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(f.ox + (r.x - c.x) * f.k, f.oy + (r.y - c.y) * f.k, r.w * f.k, r.h * f.k);
  }
}
function toFrame(e) {
  const b = view.getBoundingClientRect(), c = crop || FULL, f = fit(c);
  const px = (e.clientX - b.left) * W / b.width, py = (e.clientY - b.top) * H / b.height;
  return { x: Math.max(c.x, Math.min(c.x + c.w, c.x + (px - f.ox) / f.k)),
           y: Math.max(c.y, Math.min(c.y + c.h, c.y + (py - f.oy) / f.k)) };
}
view.onpointerdown = e => { const p = toFrame(e); drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; view.setPointerCapture(e.pointerId); };
view.onpointermove = e => { if (!drag) return; const p = toFrame(e); drag.x1 = p.x; drag.y1 = p.y; draw(); };
view.onpointerup = view.onpointercancel = () => {
  if (!drag) return;
  const r = norm(drag);
  drag = null;
  if (r.w >= 8 && r.h >= 8) crop = r;     // a click (or a sliver) keeps the view as it is
  draw(); countPixels();
};
document.getElementById('crop-reset').onclick = () => { crop = null; draw(); countPixels(); };
document.getElementById('snap').onclick = () => view.toBlob(b => {
  const a = document.createElement('a'), c = crop || FULL;
  a.href = URL.createObjectURL(b);
  a.download = `dvs-${new Date().toISOString().replace(/[-:]|\.\d+Z/g, '')}-${c.x}_${c.y}_${c.w}x${c.h}` +
    (rot ? `-rot${rot * 90}` : '') + '.png';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
// lit pixels in the region of the frame shown (dim trails of fade under the threshold left out); ON/OFF for color 0
function countPixels() {
  const c = crop || FULL, info = document.getElementById('crop-info');
  if (!frame) return;
  offx.drawImage(frame, 0, 0);
  const d = offx.getImageData(c.x, c.y, c.w, c.h).data;
  let on = 0, all = 0;
  for (let i = 0; i < d.length; i += 4)
    if (d[i] + d[i + 1] + d[i + 2] > 96) { all++; on += d[i + 1] > d[i]; }
  const split = params.color && params.color.v === 0 ? ` (ON ${on}, OFF ${all - on})` : '';
  info.textContent = (rot ? `${rot * 90}° 회전 · ` : '') +
    (crop ? `영역 x ${c.x}, y ${c.y}, ${c.w}×${c.h} px, ${fit(c).k.toFixed(1)}배` : `전체 ${W}×${H}`) +
    ` · 켜진 픽셀 ${all.toLocaleString()} (${(all * 100 / (c.w * c.h)).toFixed(2)}%)${split}`;
}
async function refreshView() {
  const fps = +document.getElementById('webfps').value, t0 = performance.now();
  if (fps && !document.hidden) {
    try {
      const r = await fetch('/frame.png?t=' + Date.now());
      if (r.ok) {
        const bm = await createImageBitmap(await r.blob());
        if (raw) raw.close();
        raw = bm;
        frame = orient();
        draw(); countPixels(); shown++;
      }
    } catch (e) { /* board restarting: try again */ }
  }
  if (t0 - rateT > 2000) {
    document.getElementById('webrate').textContent = fps ? `받는 중 ${(shown * 1000 / (t0 - rateT)).toFixed(1)} fps` : '';
    shown = 0; rateT = t0;
  }
  setTimeout(refreshView, Math.max(fps ? 1000 / fps - (performance.now() - t0) : 500, 0));
}

// graphs (GET /history, 11.50, 11.51): the board keeps an hour, one row per 2 s, in the capture process (a dvslive

  ['MIPI (CSIS 수신)', '이벤트 데이터', 'MB/s', dataMB],
  ['MIPI (CSIS 수신)', '프레임 채움', '%', fill],
  ['DRAM (VC0 버퍼)', '도착 버퍼', '/s', val('buffers')],
  ['DRAM (VC0 버퍼)', '빈 버퍼 (DMA용, 최소)', '개', val('vc0_free'), 1],
  ['DRAM (VC0 버퍼)', '처리 대기 버퍼 (최대)', '개', val('vc0_wait'), 1],
  ['DRAM (VC0 버퍼)', '버퍼 복사', 'ms', val('ingest_ms')],

});
let group = null;
const cards = CHARTS.map(([grp, name, unit, f, bufAxis]) => {
  if (grp !== group) {
    group = grp;
    document.getElementById('charts').append(Object.assign(document.createElement('h2'), { className: 'grp', textContent: grp }));
  }

  el.className = 'chart';

  el.querySelector('.name').textContent = name;

const fmt = x => x === null ? '–' : Math.abs(x) >= 100 ? Math.round(x).toLocaleString() : +x.toPrecision(3) + '';

}

  try {
    const since = hrows.length ? hrows[hrows.length - 1][0] : 0;
    const j = await (await fetch('/history?since=' + since)).json();
    hkeys = j.keys;
    frameBytes = j.frame_bytes || frameBytes;
    hrows = hrows.concat(j.rows).slice(-1800);
    if (!document.hidden) drawCharts();
  } catch (e) { /* board restarting: the next poll */ }
}
document.getElementById('h-win').onchange = drawCharts;
window.addEventListener('resize', drawCharts);
document.getElementById('h-csv').onclick = () => {
  const lines = [hkeys.join(',')].concat(hrows.map(r => [new Date(r[0] * 1000).toISOString()].concat(r.slice(1)).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
  a.download = `dvs-stats-${new Date().toISOString().replace(/[-:]|\.\d+Z/g, '')}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

(async () => {
  try {
    params = await (await fetch('/params')).json();
    build();
  } catch (e) { show('설정을 읽을 수 없음: ' + e.message); }
  const q = new URLSearchParams(location.search).get('rot');
  let r0 = 0;
  try { r0 = +localStorage.getItem('dvs-rot') || 0; } catch (e) { /* no storage: upright */ }
  setRot(q !== null ? Math.round(+q / 90) || 0 : r0);
  loadSensor(); refreshStats(); refreshView();
  setInterval(refreshStats, 2000);
  refreshRec();
  setInterval(refreshRec, 1000);
  refreshAct();
  setInterval(refreshAct, 1000);
  refreshHistory();
  setInterval(refreshHistory, 2000);
})();
</script>
</body>
