<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVS 화면 조정</title>
<style>
  :root { --bg: #111; --panel: #1b1b1b; --fg: #e8e8e8; --dim: #9a9a9a; --accent: #4fc36a; --line: #2c2c2c; --alarm: #ff5a4f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  #view { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #000; border-radius: 4px; display: block; }
  h2 { font-size: 15px; margin: 18px 0 2px; color: var(--dim); font-weight: 600; }
  #s-apply { margin-top: 6px; }
  #stats { color: var(--dim); font: 13px/1.5 ui-monospace, Menlo, monospace; margin-top: 8px; min-height: 3em; }
  .row { display: grid; grid-template-columns: 7.5em 1fr 3.5em; gap: 8px; align-items: center; margin: 10px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row select { grid-column: 2 / 4; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button { background: #262626; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px 10px; font: inherit; }
  button:hover, select:hover { border-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .hint { color: var(--dim); font-size: 13px; margin: 2px 0 0 8.1em; }
  #msg { color: var(--dim); font-size: 13px; min-height: 1.4em; }
  #act { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 4px 0 10px; }
  #a-state { font-size: 28px; font-weight: 700; }
  #a-top { color: var(--dim); font-size: 13px; }
  #a-recent { color: var(--dim); font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 4px 0 0; padding-left: 1.6em; }
  .fall { color: var(--alarm) !important; }
  .toggle { display: flex; gap: 8px; align-items: center; color: var(--dim); margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>DVS 화면 조정</h1>
    <div id="act" aria-live="polite"><span id="a-state">분류기 기다리는 중…</span><span id="a-top"></span></div>
    <canvas id="view" width="960" height="720" aria-label="지금 HDMI에 나가는 화면"></canvas>
    <div class="toggle"><label for="webfps">미리보기</label>
      <select id="webfps"><option value="0">끔</option><option value="2">2 fps</option><option value="5">5 fps</option>
        <option value="10" selected>10 fps</option><option value="15">15 fps</option><option value="20">20 fps</option>
        <option value="30">30 fps</option></select>
      <span id="webrate"></span></div>
    <div id="stats">통계 기다리는 중…</div>
    <h2>최근 판정 변화</h2>
    <ol id="a-recent"></ol>
  </section>
  <section class="panel">
    <div class="presets">
      <button data-preset="default">기본값</button>
      <button data-preset="clean">잡음 제거</button>
      <button data-preset="trails">잔상</button>
      <button data-preset="full">전체 화면</button>
    </div>
    <div id="controls"></div>
    <div id="msg"></div>
    <h2>센서 (적용하면 스트림을 다시 시작, 약 5초)</h2>
    <div class="row"><label for="s-rate">scan 속도</label><select id="s-rate"></select></div>
    <div class="hint" id="s-rate-hint"></div>
    <div class="row"><label for="s-flush_us">MIPI flush</label><input type="range" id="s-flush_us" min="1" max="1023" step="1">
      <output id="o-flush_us"></output></div>
    <div class="hint">센서 FIFO를 이 시간(µs)마다 내보냄: 짧을수록 버퍼가 잦고 지연이 적음, 기본 50</div>
    <button id="s-apply">센서 설정 적용</button>
    <div id="s-msg" class="hint"></div>
    <h2>행동 녹화 (학습용, 3초 뒤 시작)</h2>
    <div class="row"><label for="r-label">동작</label><select id="r-label"></select></div>
    <div class="row"><label for="r-s">길이</label><select id="r-s"><option value="4">4초</option>
      <option value="6" selected>6초</option><option value="10">10초</option><option value="20">20초</option></select></div>
    <button id="r-go">녹화</button>
    <div id="r-msg" class="hint" aria-live="polite"></div>
  </section>
</main>
<script>
const LABELS = {
  fps: ['화면 갱신', 'fps', '초당 그리는 횟수'],
  window_ms: ['누적 시간', 'ms', '한 장에 모아 그리는 센서 시간, 0 = 한 프레임'],
  fade: ['잔상', '', '0 = 매번 지움, 클수록 이전 장면이 오래 남음'],
  filter_ms: ['잡음 필터', 'ms', '이웃 픽셀이 이 시간 안에 반응한 이벤트만, 0 = 끔'],
  color: ['색', '', ''],
  zoom: ['크기', '', ''],
  flip: ['뒤집기', '', ''],
  margin_ms: ['재생 여유', 'ms', '작을수록 지연이 줄고 늦은 이벤트를 놓침'],
};
const CHOICES = {
  color: ['ON 초록 / OFF 빨강', 'ON 흰색 / OFF 파랑', '모두 흰색', 'ON만', 'OFF만'],
  zoom: ['960×720 (1배)', '1440×1080 (1.5배, 세로 꽉)'],
  flip: ['그대로', '좌우 반전', '상하 반전', '180° 회전'],
};
const PRESETS = {
  clean: { filter_ms: 4, fade: 0 },
  trails: { fade: 200, window_ms: 0 },
  full: { zoom: 1 },
};
let params = {}, pending = {}, timer = null;

function show(msg) { document.getElementById('msg').textContent = msg; }

function post(changes) {
  Object.assign(pending, changes);
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const body = JSON.stringify(pending);
    pending = {};
    try {
      const r = await fetch('/params', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const j = await r.json();
      if (j.params) { for (const k in j.params) params[k].v = j.params[k]; sync(); }
      show(j.rejected && j.rejected.length ? '적용 안 됨: ' + j.rejected.join(', ') : '적용됨, 다음 실행에도 유지');
    } catch (e) { show('보드에 연결할 수 없음: ' + e.message); }
  }, 120);
}

function sync() {
  for (const [k, p] of Object.entries(params)) {
    const el = document.getElementById('p-' + k);
    if (!el) continue;
    el.value = p.v;
    const out = document.getElementById('o-' + k);
    if (out) out.textContent = p.v + (LABELS[k] ? LABELS[k][1] : '');
  }
}

function build() {
  const box = document.getElementById('controls');
  box.textContent = '';
  for (const [k, p] of Object.entries(params)) {
    const [name, unit, hint] = LABELS[k] || [k, '', ''];
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('label');
    lab.htmlFor = 'p-' + k;
    lab.textContent = name;
    row.append(lab);
    let input;
    if (CHOICES[k]) {
      input = document.createElement('select');
      CHOICES[k].forEach((text, i) => { if (i >= p.min && i <= p.max) input.add(new Option(text, i)); });
      input.onchange = () => post({ [k]: +input.value });
      row.append(input);
    } else {
      input = document.createElement('input');
      input.type = 'range';
      input.min = p.min; input.max = p.max; input.step = 1;
      const out = document.createElement('output');
      out.id = 'o-' + k;
      input.oninput = () => { out.textContent = input.value + unit; post({ [k]: +input.value }); };
      row.append(input, out);
    }
    input.id = 'p-' + k;
    box.append(row);
    if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hint; box.append(h); }
  }
  sync();
}

document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const name = b.dataset.preset;
  const changes = name === 'default'
    ? Object.fromEntries(Object.entries(params).map(([k, p]) => [k, p.def]))
    : PRESETS[name];
  for (const k in changes) if (params[k]) params[k].v = changes[k];
  sync();
  post(changes);
});

let lastCrc = null;
async function refreshStats() {
  try {
    const s = await (await fetch('/stats')).json(), t = performance.now();
    let crc = '';
    if (s.crc !== undefined) {
      if (lastCrc && s.crc >= lastCrc.n) crc = `, CRC 오류 ${Math.round((s.crc - lastCrc.n) * 1000 / (t - lastCrc.t))}/s`;
      lastCrc = { n: s.crc, t };
    }
    if (s.fps === undefined) return;
    document.getElementById('stats').textContent =
      `${s.fps} fps, 그리기 ${s.draw_ms} ms, 프레임당 이벤트 ${s.events}\n` +
      `버퍼 ${s.buffers}/s, 복사 ${s.ingest_ms} ms, ${s.kb} kB/버퍼\n` +
      `최신 이벤트보다 ${s.behind_ms} ms 늦음, 시간의 ${s.coverage}%에 데이터, 어두운 프레임 ${s.dips}장/2초\n` +
      `센서 scan ${s.scan_us} µs (${Math.round(1e6 / s.scan_us)} fps)${crc}`;
    document.getElementById('stats').style.whiteSpace = 'pre-line';
  } catch (e) { /* the next poll will tell */ }
}

// one request at a time, as often as the chosen rate allows; drawn on a canvas so nothing is fetched twice
const ctx = document.getElementById('view').getContext('2d');
let shown = 0, rateT = performance.now();
async function refreshView() {
  const fps = +document.getElementById('webfps').value, t0 = performance.now();
  if (fps && !document.hidden) {
    try {
      const r = await fetch('/frame.png?t=' + Date.now());
      if (r.ok) { ctx.drawImage(await createImageBitmap(await r.blob()), 0, 0); shown++; }
    } catch (e) { /* board restarting: try again */ }
  }
  if (t0 - rateT > 2000) {
    document.getElementById('webrate').textContent = fps ? `받는 중 ${(shown * 1000 / (t0 - rateT)).toFixed(1)} fps` : '';
    shown = 0; rateT = t0;
  }
  setTimeout(refreshView, Math.max(fps ? 1000 / fps - (performance.now() - t0) : 500, 0));
}

// sensor: scan rate -> CIS margin (DTAG_FRM_MARGIN, 2^12 event clocks each); 0 = the setfile's 2
const SCAN_BASE = 430, SCAN_LSB = 32.4;	/* us, fitted to margin 2/17/18/48 = 495/985/1015/1985 us (11.29) */
const RATES = [0, 1500, 1000, 750, 500, 250];
let sensorCur = {};
// the largest margin that still gives at least fps scans/s
function marginFor(fps) { return fps ? Math.max(1, Math.floor((1e6 / fps - SCAN_BASE) / SCAN_LSB)) : 0; }
function scanFor(m) { return SCAN_BASE + SCAN_LSB * (m || 2); }
async function loadSensor() {
  try {
    sensorCur = await (await fetch('/sensor')).json();
  } catch (e) { document.getElementById('s-msg').textContent = '센서 설정을 읽을 수 없음'; return false; }
  const sel = document.getElementById('s-rate'), m = sensorCur.margin.v;
  sel.textContent = '';
  for (const fps of RATES) {
    const mm = marginFor(fps);
    sel.add(new Option(fps ? `${fps} fps (margin ${mm})` : `약 2000 fps (setfile, margin 2)`, mm));
  }
  if (![...sel.options].some(o => +o.value === m)) sel.add(new Option(`margin ${m}`, m));
  sel.value = m;
  const fl = document.getElementById('s-flush_us');
  fl.value = sensorCur.flush_us.v;
  document.getElementById('o-flush_us').textContent = fl.value + 'µs';
  rateHint();
  return true;
}
function rateHint() {
  const m = +document.getElementById('s-rate').value, now = sensorCur.margin ? sensorCur.margin.now : null;
  document.getElementById('s-rate-hint').textContent =
    `예상 scan ${Math.round(scanFor(m))} µs` + (now !== null ? `, 센서 모듈에 지금 margin ${now}` : '');
}
document.getElementById('s-rate').onchange = rateHint;
document.getElementById('s-flush_us').oninput = e => { document.getElementById('o-flush_us').textContent = e.target.value + 'µs'; };
document.getElementById('s-apply').onclick = async () => {
  const msg = document.getElementById('s-msg');
  const body = JSON.stringify({ margin: +document.getElementById('s-rate').value,
                                flush_us: +document.getElementById('s-flush_us').value });
  try {
    const r = await fetch('/sensor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    if (!r.ok) { msg.textContent = '적용 안 됨: ' + (await r.text()); return; }
  } catch (e) { msg.textContent = '보드에 연결할 수 없음: ' + e.message; return; }
  msg.textContent = '스트림 다시 시작 중…';
  await new Promise(res => setTimeout(res, 3000));
  for (let i = 0; i < 30; i++) {
    if (await loadSensor()) { msg.textContent = '적용됨 (측정한 scan은 위 통계, 2초 뒤 갱신)'; return; }
    await new Promise(res => setTimeout(res, 1000));
  }
  msg.textContent = '30초 안에 돌아오지 않음: 보드를 확인하세요';
};

// the recorder (POST /rec, 11.39): labels in dvsact.CLASSES order
const ACTS = [['none', '사람 없음'], ['still', '가만히'], ['walk', '걷기'], ['sit_down', '앉기'], ['stand_up', '일어서기'],
              ['pick_up', '줍기'], ['lie_down', '눕기'], ['fall', '넘어짐'], ['other', '기타 움직임']];
const REC_ERR = { 400: '동작이나 길이가 잘못됨', 409: '이미 녹화 중', 507: '보드 저장 공간 부족(300 MB 미만)' };
for (const [v, name] of ACTS) document.getElementById('r-label').add(new Option(name + ' (' + v + ')', v));
function showRec(st) {
  const m = document.getElementById('r-msg');
  document.getElementById('r-go').disabled = st.state !== 'idle';
  if (st.state === 'countdown') m.textContent = Math.ceil(st.left_s) + '초 뒤 시작';
  else if (st.state === 'recording') m.textContent = '녹화 중, ' + Math.ceil(st.left_s) + '초 남음';
  else m.textContent = st.last ? '마지막: ' + st.last : '';
}
async function refreshRec() {
  try { showRec(await (await fetch('/rec')).json()); } catch (e) { /* the stats line says when the board is gone */ }
}
document.getElementById('r-go').onclick = async () => {
  const body = JSON.stringify({ label: document.getElementById('r-label').value, s: +document.getElementById('r-s').value });
  try {
    const r = await fetch('/rec', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    const st = await r.json();
    if (!r.ok) { document.getElementById('r-msg').textContent = '시작 안 됨: ' + (REC_ERR[r.status] || r.status); return; }
    showRec(st);
  } catch (e) { document.getElementById('r-msg').textContent = '보드에 연결할 수 없음: ' + e.message; }
};

// the classifier (GET /act, 11.45): the judge's state, this step's top class, its newest changes in local time
const NAME = Object.fromEntries(ACTS);
const EVENT = { appear: '나타남', move: '움직임', fall: '넘어짐!' };
async function refreshAct() {
  let st;
  try { st = await (await fetch('/act')).json(); } catch (e) { return; }
  const s = document.getElementById('a-state');
  s.textContent = st.on ? (NAME[st.state] || st.state) : '분류기 꺼짐';
  s.className = st.on && st.state === 'fall' ? 'fall' : '';
  document.getElementById('a-top').textContent = st.on && st.top ? '지금 후보: ' + (NAME[st.top] || st.top) + ' ' + st.p.toFixed(2) : '';
  document.getElementById('a-recent').replaceChildren(...st.recent.map(r => {
    const li = document.createElement('li');
    li.textContent = new Date(r.t_us / 1000).toLocaleTimeString('ko-KR', { hour12: false }) + '  ' +
      (EVENT[r.event] || r.event) + ' → ' + (NAME[r.state] || r.state) + ' (' + r.p.toFixed(2) + ')';
    if (r.event === 'fall') li.className = 'fall';
    return li;
  }));
}

(async () => {
  try {
    params = await (await fetch('/params')).json();
    build();
  } catch (e) { show('설정을 읽을 수 없음: ' + e.message); }
  loadSensor(); refreshStats(); refreshView();
  setInterval(refreshStats, 2000);
  refreshRec();
  setInterval(refreshRec, 1000);
  refreshAct();
  setInterval(refreshAct, 1000);
})();
</script>
</body>
</html>
