<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVS 보정 바둑판</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #888; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 8px; bottom: 8px; }
  button { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="깜빡이는 바둑판"></canvas>
<div id="info"><button id="fs">전체 화면</button> <span id="sq"></span></div>
<script>
// dvs3d.py calib (11.56): 10 x 7 squares (9 x 6 inner corners). Only the white squares blink (board <-> black every
// 100 ms): a DVS fires on them alone, so its time surface shows the board. Inverting would fire every square.
const c = document.getElementById('c'), x = c.getContext('2d');
let on = false;
function draw() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const s = Math.floor(Math.min(c.width / 11, c.height / 8)), ox = (c.width - 10 * s) / 2, oy = (c.height - 7 * s) / 2;
  x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
  if (on) {
    x.fillStyle = '#fff';
    for (let r = 0; r < 7; r++) for (let k = 0; k < 10; k++) if ((r + k) % 2) x.fillRect(ox + k * s, oy + r * s, s, s);
  }
  document.getElementById('sq').textContent =
    `한 칸 ${Math.round(s / devicePixelRatio)} CSS px: 화면에서 자로 재서 --square 값(m)으로 주세요`;
}
setInterval(() => { on = !on; draw(); }, 100);
document.getElementById('fs').onclick = () => document.documentElement.requestFullscreen();
addEventListener('resize', draw);
draw();
</script>
</body>
</html>
