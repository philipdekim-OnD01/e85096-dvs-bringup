<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVS 3D</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --dim: #6b6b66; --line: #d8d8d2; --card: #fff; --warn: #a3471a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --fg: #ececea; --dim: #9a9a94; --line: #34342f; --card: #1f1f1d; --warn: #f0a070; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  #cloud { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; touch-action: none; cursor: grab; display: block; }
  #views { width: 100%; image-rendering: pixelated; background: #000; border-radius: 6px; display: block; }
  #note { color: var(--warn); min-height: 1.5em; }
  table { border-collapse: collapse; width: 100%; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  td { padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--dim); white-space: nowrap; }
</style>
</head>
<body>
<h1>DVS 3D</h1>
<p class="sub">보드1(왼쪽) + 보드2(오른쪽) 이벤트로 만든 점구름. 끌면 회전, 휠로 확대, 두 번 누르면 처음 시점. 색: 가까움 빨강 → 멀어짐 파랑.</p>
<div class="grid">
  <div class="card"><canvas id="cloud" width="960" height="720" role="img" aria-label="3D 점구름"></canvas>
    <div id="note" aria-live="polite"></div></div>
  <div>
    <div class="card"><img id="views" alt="정류한 두 화면 (왼쪽 보드1, 오른쪽 보드2)"></div>
    <div class="card" style="margin-top:16px"><table id="stats"><tr><td>상태</td><td>기다리는 중…</td></tr></table></div>
  </div>
</div>
<script>
const cv = document.getElementById('cloud'), cx = cv.getContext('2d');
let pts = { n: 0, xyz: new Float32Array(0), val: new Uint8Array(0) }, center = null;
const view0 = { yaw: 0, pitch: 0, dist: 1.5 };
let view = { ...view0 }, drag = null;

function draw() {
  const W = cv.width, H = cv.height, f = W * 0.9, n = pts.n;
  cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
  if (!n) return;
  const z = Array.from(pts.xyz.filter((_, i) => i % 3 === 2)).sort((a, b) => a - b);
  const z0 = z[Math.floor(n * 0.05)], z1 = z[Math.floor(n * 0.95)] + 1e-6;
  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const buckets = Array.from({ length: 16 }, () => []);
  for (let i = 0; i < n; i++) {
    const x = pts.xyz[3 * i] - center[0], y = pts.xyz[3 * i + 1] - center[1], zz = pts.xyz[3 * i + 2] - center[2];
    const x1 = cy * x + sy * zz, z1r = -sy * x + cy * zz;          // yaw about the vertical axis
    const y2 = cp * y - sp * z1r, z2 = sp * y + cp * z1r + view.dist;  // then pitch
    if (z2 < 0.05) continue;
    const t = Math.min(15, Math.max(0, Math.floor(16 * (pts.xyz[3 * i + 2] - z0) / (z1 - z0))));
    buckets[t].push(W / 2 + f * x1 / z2, H / 2 + f * y2 / z2);
  }
  buckets.forEach((b, t) => {
    cx.fillStyle = `hsl(${t * 15}, 90%, 58%)`;
    for (let k = 0; k < b.length; k += 2) cx.fillRect(b[k] - 1, b[k + 1] - 1, 2, 2);
  });
}

cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, ...view }; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => {
  if (!drag) return;
  view.yaw = drag.yaw + (e.clientX - drag.x) * 0.01;
  view.pitch = Math.max(-1.5, Math.min(1.5, drag.pitch + (e.clientY - drag.y) * 0.01));
  draw();
};
cv.onpointerup = cv.onpointercancel = () => { drag = null; };
cv.onwheel = e => { e.preventDefault(); view.dist = Math.max(0.1, view.dist * Math.exp(e.deltaY * 0.001)); draw(); };
cv.ondblclick = () => { view = { ...view0 }; draw(); };

async function points() {
  try {
    const b = await (await fetch('/points')).arrayBuffer(), n = new DataView(b).getUint32(0, true);
    pts = { n, xyz: new Float32Array(b, 4, 3 * n), val: new Uint8Array(b, 4 + 12 * n, n) };
    if (n && !center) {                        // look at the middle of the first cloud, from 1.5 m nearer
      const s = [0, 0, 0];
      for (let i = 0; i < 3 * n; i++) s[i % 3] += pts.xyz[i] / n;
      center = s;
    }
    draw();
  } catch (e) { /* the next poll tries again */ }
}

const ms = v => v == null ? '–' : v.toFixed(1);
async function stats() {
  let s;
  try { s = await (await fetch('/stats')).json(); } catch (e) { return; }
  const rows = [['쌍', `${s.pairs ?? 0} (버림 ${s.dropped ?? 0})`], ['점', s.points ?? 0],
    ['입력', s.source === 'frame.png' ? 'frame.png (임시: 시각 없음, 요청 시각으로 짝)' : '/evframe'],
    ['보정', s.calib ? '있음' : '없음']];
  for (const [k, v] of Object.entries(s.timing_ms || {})) rows.push([`${k} (ms)`, v]);
  (s.boards || []).forEach((b, i) => rows.push([`보드${i + 1} ${b.host}`,
    `왕복 ${ms(b.rtt_ms)} ms${b.uncertain ? ' (동기 불확실)' : ''}, 받음 ${(b.bytes / 1e6).toFixed(1)} MB` +
    (Object.keys(b.errors).length ? `, 오류 ${JSON.stringify(b.errors)}` : '')]));
  const t = document.getElementById('stats');
  t.replaceChildren(...rows.map(([k, v]) => { const r = t.insertRow(); r.insertCell().textContent = k; r.insertCell().textContent = v; return r; }));
  document.getElementById('note').textContent = s.calib ? (s.points ? '' : '이번 쌍에서 짝을 찾은 점이 없습니다.')
    : '보정 파일(~/e850-logs/dvs3d/calib.npz)이 없어 3D 점을 만들지 않습니다. dvs3d-calib.py로 보정하세요.';
}

const img = document.getElementById('views');
setInterval(points, 200);
setInterval(stats, 1000);
setInterval(() => { img.src = '/views.png?t=' + Date.now(); }, 500);
points(); stats();
</script>
</body>
</html>
