# /etc/xdg/pcmanfm/e850/desktop-items-0.conf (e850-feature desktop, docs 11.107): pcmanfm draws the desktop with the
# icons of ~/Desktop. ~/.config/pcmanfm/e850/desktop-items-0.conf overrides it, e.g. wallpaper=<png> wallpaper_mode=crop.
[*]
wallpaper_mode=color
desktop_bg=#24323f
desktop_fg=#ffffff
desktop_shadow=#000000
show_documents=0
show_trash=0
show_mounts=0
