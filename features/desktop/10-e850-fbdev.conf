# e850-feature desktop: X on the HDMI framebuffer (dpu.ko fb0, 1920x1080, 32 bpp). There is no DRM device.
Section "Device"
    Identifier "e850-hdmi-fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "on"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "off"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
