# Installed by e850-feature (desktop): /etc/systemd/system/user@.service.d/e850-no-cpu-delegate.conf
# The desktop packages pull in libpam-systemd, so every login gets a user@UID.service, which
# delegates the cpu controller (Debian 12: Delegate=pids memory cpu) and fills it with
# CPUWeight slices. The vendor scheduler (ems.ko) indexes 9-entry arrays with the cpu cgroup id
# and panics once there are more (docs 11.80). Keep cpu out of the user managers.
[Service]
Delegate=
Delegate=pids memory
