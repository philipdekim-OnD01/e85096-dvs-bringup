# e850-feature usbhost: /etc/systemd/system/systemd-networkd-wait-online.service.d/. With host mode on at boot
# the usb0 gadget link stays down, and waiting for every link failed after 2 min (boot "degraded", nginx late;
# board 5, 11.92). One link online (Wi-Fi) is enough.
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any
