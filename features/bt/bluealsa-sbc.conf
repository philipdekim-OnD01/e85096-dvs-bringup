# e850-feature bt: /etc/systemd/system/bluealsa.service.d/. SBC in Dual Channel ("SBC XQ", 11.98): the JBL Flip 6
# accepts bit-pool 40 at most, which Joint Stereo ("high", the default) turns into 279 kbps at 48 kHz; Dual Channel
# spends the bit-pool per channel. A2DP sinks must take every SBC channel mode.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -p a2dp-source -p a2dp-sink --sbc-quality=xq
