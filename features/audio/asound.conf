# /etc/asound.conf from e850-feature audio (docs 11.77). Previous file: /etc/asound.conf.orig.
# "default" = RDMA0 at 48 kHz, which the e850-audio route sends to the headphone jack.
# - the RDMA PCM accepts 8-384 kHz but only 48 kHz plays at the right speed (44.1 kHz ran 15 % fast),
#   so plug converts everything to 48 kHz S16 stereo;
# - no dmix: the kernel has no SysV IPC (dmix: "unable to create IPC semaphore"), so one client at a time.
pcm.!default {
    type plug
    slave {
        pcm "hw:ExynosMadera,0"
        rate 48000
        format S16_LE
        channels 2
    }
}
ctl.!default {
    type hw
    card ExynosMadera
}
