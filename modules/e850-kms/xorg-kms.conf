# X on e850-kms (/dev/dri/card0): modesetting + glamor, Mesa panfrost on the kbase shim (11.86).
# x-kms.sh passes this with -config and an empty -configdir, so /etc/X11/xorg.conf.d (fbdev, the
# normal desktop) is not read.
Section "ServerFlags"
    Option "AutoAddGPU" "off"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "e850-kms"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "glamor"
EndSection

# Our Mesa has no GLX (-Dglx=disabled); clients use EGL. Keeps libglx from loading a DRI driver.
Section "Module"
    Disable "glx"
EndSection
